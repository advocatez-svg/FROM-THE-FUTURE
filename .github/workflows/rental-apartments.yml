name: تحديث إيجارات عمّان (مرتين يومياً)
# Initial collection is triggered when this workflow reaches main.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rental-apartments.yml"
      - "scripts/pipeline_rentals.py"
  schedule:
    - cron: '0 9 * * *'   # 12:00 Asia/Amman
    - cron: '0 19 * * *'  # 22:00 Asia/Amman
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rental-apartment-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: جمع وتنظيف إعلانات الإيجار
        run: python scripts/pipeline_rentals.py
      - name: حفظ بيانات الإيجارات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rentals_*.json
          git commit -m "تحديث دوري لإيجارات عمّان ($(date -u +%F))" || echo "لا تغييرات"
          git push || echo "لا شيء للدفع"
